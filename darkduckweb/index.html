<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HuSsEiN07</title>
  <meta name="description" content="Small steps, every single day.">
  <meta name="theme-color" content="#0a0c11">

  <!-- معاينة الرابط عند مشاركته (ديسكورد، تلغرام، واتساب...) -->
  <!-- مهم: استبدل YOUR-DOMAIN برابط موقعك الحقيقي بعد النشر، مثلاً https://hussein07.pages.dev -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="HuSsEiN07">
  <meta property="og:description" content="Small steps, every single day.">
  <meta property="og:image" content="https://YOUR-DOMAIN/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://YOUR-DOMAIN/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HuSsEiN07">
  <meta name="twitter:description" content="Small steps, every single day.">
  <meta name="twitter:image" content="https://YOUR-DOMAIN/assets/img/og-image.jpg">

  <script>
    document.documentElement.classList.add("js");
    /* الحاسوب (فأرة): نقفل التمرير من البداية حتى لا تومض الصفحة. الجوال يبقى كما هو */
    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) document.documentElement.classList.add("lock");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="preload" data-section="home">
  <noscript><style>.preload .topbar, .preload #home .card { opacity: 1 !important; transform: none !important; }</style></noscript>

  <!-- الخلفية + المطر -->
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-alt" aria-hidden="true"></div>
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- شاشة الدخول: تظهر فقط إذا منع المتصفح التشغيل التلقائي للأغنية -->
  <button id="gate" class="gate" type="button" hidden>
    <i class="fa-solid fa-music"></i>
    <span>اضغط للدخول</span>
  </button>

  <!-- شريط التنقل العلوي -->
  <header class="topbar">
    <nav class="tabs" aria-label="التنقل">
      <a href="#home" class="tab active" data-target="home" aria-current="page"><i class="fa-solid fa-user"></i><span>Home</span></a>
      <a href="#about" class="tab" data-target="about"><i class="fa-solid fa-circle-info"></i><span>About</span></a>
      <a href="#projects" class="tab" data-target="projects"><i class="fa-solid fa-folder-open"></i><span>Projects</span></a>
      <a href="#steps" class="tab" data-target="steps"><i class="fa-solid fa-shoe-prints"></i><span>Steps</span></a>
    </nav>

    <!-- الساعة (24 ساعة، بتوقيت ليبيا) + التاريخ الميلادي والهجري -->
    <div class="clock-wrap">
      <div class="clock" role="timer" aria-label="الوقت الآن بتوقيت ليبيا">
        <i class="fa-regular fa-clock"></i>
        <time dir="ltr"><span id="clkH">--</span><span class="colon">:</span><span id="clkM">--</span><span class="colon sec">:</span><span class="sec" id="clkS">--</span></time>
      </div>
      <div class="dates" dir="rtl" aria-label="التاريخ">
        <span id="dateG"></span>
        <span id="dateH"></span>
      </div>
    </div>
  </header>

  <!-- الصفحة الرئيسية -->
  <section class="page-section" id="home">
  <main class="card" id="card">
    <canvas class="glass-drops" id="glassDrops" aria-hidden="true"></canvas>

    <!-- صورة البروفايل + أفيكت ديسكورد -->
    <div class="avatar-wrap">
      <img class="avatar" id="avatar" src="assets/img/avatar.jpg" alt="صورة HuSsEiN07">
      <img class="decor" id="avatarDecor" alt="" hidden>
    </div>

    <h1 class="name glitch" id="name" data-text="HuSsEiN07">DarkDuck</h1>
    <p class="bio" dir="ltr">Hi, My Name's Hussein Haman.</p>
    <p class="location"><i class="fa-solid fa-location-dot"></i><span>LIBYA</span></p>

    <!-- ديسكورد -->
    <section class="discord" id="discord" aria-label="حالة ديسكورد">
      <div class="dc-avatar">
        <img id="dcAvatar" src="assets/img/avatar.jpg" alt="">
        <span class="dot" id="dcDot" data-status="offline"></span>
      </div>
      <div class="dc-info">
        <div class="dc-top">
          <strong id="dcName" dir="auto">Discord</strong>
          <i class="fa-brands fa-discord"></i>
        </div>
        <div class="dc-status" id="dcStatus">جاري التحميل…</div>
        <div class="dc-activity" id="dcActivity" hidden></div>
      </div>
    </section>

    <!-- الأغنية -->
    <section class="player" id="player" aria-label="مشغل الأغنية">
      <audio id="audio" src="assets/audio/rain.mp3" loop preload="auto"></audio>
      <div class="pl-row">
        <button class="pl-btn pl-play" id="plPlay" type="button" aria-label="تشغيل أو إيقاف">
          <i class="fa-solid fa-play"></i>
        </button>
        <div class="pl-title">
          <i class="fa-solid fa-compact-disc"></i>
          <span id="songTitle" dir="ltr">Rain</span>
        </div>
        <button class="pl-btn pl-fold" id="plFold" type="button" aria-label="طي المشغل" aria-expanded="true">
          <i class="fa-solid fa-chevron-up"></i>
        </button>
      </div>
      <div class="pl-bar" id="plBar" dir="ltr">
        <span class="pl-time" id="timeNow">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="شريط التقدم">
        <span class="pl-time" id="timeEnd">0:00</span>
      </div>
    </section>

    <!-- التواصل الاجتماعي (عدّل الروابط من هنا) -->
    <nav class="socials" aria-label="حساباتي">
      <a href="https://facebook.com/h.hussein07" target="_blank" rel="noopener" aria-label="فيسبوك"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://instagram.com/h.hussein07" target="_blank" rel="noopener" aria-label="انستغرام"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://t.me/darkduck07" target="_blank" rel="noopener" aria-label="تلغرام"><i class="fa-brands fa-telegram"></i></a>
      <a href="https://discord.com/users/1070354089449377792" target="_blank" rel="noopener" aria-label="ديسكورد"><i class="fa-brands fa-discord"></i></a>
      <a href="https://github.com/darkduckdev" target="_blank" rel="noopener" aria-label="غيت هب"><i class="fa-brands fa-github"></i></a>
    </nav>

    <!-- عدد الزوار -->
    <div class="views" title="عدد الزيارات">
      <i class="fa-solid fa-eye"></i>
      <span id="viewCount">—</span>
    </div>

    <!-- الحقوق -->
    <footer class="copyright">
      <span class="live-dot" aria-hidden="true"></span>
      <small dir="ltr">&copy; 2026 HuSsEiN07</small>
    </footer>
  </main>
  </section>

  <!-- About (قريباً) -->
  <section class="page-section" id="about">
    <div class="card soon reveal">
      <div class="soon-icon"><i class="fa-solid fa-circle-info"></i></div>
      <h2>About</h2>
      <span class="badge-soon">Soon</span>
      <p>About me is coming soon</p>
    </div>
  </section>

  <!-- مشاريعي -->
  <section class="page-section" id="projects">
    <div class="card soon reveal">
      <div class="soon-icon"><i class="fa-solid fa-folder-open"></i></div>
      <h2>Projects</h2>
      <span class="badge-soon">Soon</span>
      <p>My projects are coming soon</p>
    </div>
  </section>

  <!-- خطواتي -->
  <section class="page-section" id="steps">
    <div class="card soon reveal">
      <div class="soon-icon"><i class="fa-solid fa-shoe-prints"></i></div>
      <h2>Steps</h2>
      <span class="badge-soon">Soon</span>
      <p>A small step every day, documented here soon</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
